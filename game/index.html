<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gilded Getaway — a heist in the Halcyon Gallery</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0e18; }
  #game { position: fixed; inset: 0; margin: auto; display: block; touch-action: none; background: #10131d; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Gilded Getaway: cross the gallery unseen, steal the loot, and slip out the vent"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
